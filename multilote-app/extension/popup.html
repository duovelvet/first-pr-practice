<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MultiLote</title>
    <style>
      body { width: 300px; font: 14px system-ui, sans-serif; margin: 0; padding: 14px; color: #0f172a; }
      h1 { font-size: 16px; margin: 0 0 12px; color: #1b46a3; }
      input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2158cc; color: #fff; cursor: pointer; font-size: 13px; }
      button.secondary { background: #e2e8f0; color: #334155; }
      button:disabled { opacity: 0.5; }
      .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; }
      .muted { color: #64748b; font-size: 12px; }
      .err { color: #dc2626; font-size: 12px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>MultiLote</h1>

    <form id="login" class="hidden">
      <input id="email" type="email" placeholder="Correo" required />
      <input id="password" type="password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
      <p id="loginError" class="err"></p>
    </form>

    <div id="app" class="hidden">
      <p class="muted">
        La extensión revisa la cola de tareas cada minuto. Publica desde el panel web y mantén Chrome abierto.
      </p>
      <p id="status"></p>
      <div class="row">
        <button id="syncNow">Sincronizar ahora</button>
        <button id="logout" class="secondary">Salir</button>
      </div>
      <p class="row"><a id="openWeb" href="#" target="_blank">Abrir panel web</a></p>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
